<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DICIDY — Play · Shop · Sports · Trading</title>
  <meta name="description" content="DICIDY master platform. Gaming, Shopping, Sports and Trading.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">DICIDY</div>
      <div class="tagline">ONE PLATFORM · FOUR WORLDS</div>
    </header>

    <section class="hero">
      <p class="eyebrow">WELCOME TO DICIDY</p>
      <h1>Choose your world.</h1>
      <p class="intro">Play. Shop. Improve. Trade.</p>
    </section>

    <section class="cards" aria-label="DICIDY sections">
      <a class="card" href="/gaming" aria-label="Gaming">
        <img src="assets/gamingcard.png" alt="Gaming">
        <div class="card-label">GAMING</div>
      </a>

      <a class="card" href="/shop" aria-label="Shop">
        <img src="assets/shopcard.png" alt="Shop">
        <div class="card-label">SHOP</div>
      </a>

      <a class="card" href="/sports" aria-label="Sports">
        <img src="assets/sportcard.png" alt="Sports">
        <div class="card-label">SPORTS</div>
      </a>

      <a class="card" href="/trading" aria-label="Trading">
        <img src="assets/tradingcard.png" alt="Trading">
        <div class="card-label">TRADING</div>
      </a>
    </section>

    <footer>
      <span>DICIDY.MY.ID</span>
      <span>© 2026 DICIDY</span>
    </footer>
  </main>
</body>
</html>
